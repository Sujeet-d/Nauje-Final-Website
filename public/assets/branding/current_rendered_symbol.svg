        <line x1="95" y1="11" x2="123" y2="43" />
        <line x1="123" y1="43" x2="95" y2="76" />
        <line x1="95" y1="11" x2="48" y2="76" />
        <line x1="55" y1="11" x2="48" y2="76" />
        
        {/* 5. Crown Right Facets */}
        <line x1="225" y1="11" x2="197" y2="43" />
